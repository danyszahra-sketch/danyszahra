name: Build Flutter APK

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Fix Gradle Wrapper
        run: |
          echo "=== Current Gradle Wrapper ==="
          cat android/gradle/wrapper/gradle-wrapper.properties

          echo "=== Fixing Gradle URL ==="
          sed -i 's#https://github.com/gradle/gradle-distributions/releases/download/v8.14.0/gradle-8.14.0-all.zip#https://services.gradle.org/distributions/gradle-8.14.0-all.zip#g' android/gradle/wrapper/gradle-wrapper.properties

          echo "=== Gradle Wrapper After Fix ==="
          cat android/gradle/wrapper/gradle-wrapper.properties

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sanurbeach-apk
          path: build/app/outputs/flutter-apk/app-release.apk
